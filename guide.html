<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Post-editing Cheat Sheet</title>
<link rel="stylesheet" href="style.css">
<style>
  .doc { max-width: 820px; margin: 0 auto; padding: 16px; }
  .doc table { border-collapse: collapse; width: 100%; margin: 8px 0 16px; font-size: 15px; display: block; overflow-x: auto; }
  .doc th, .doc td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .doc th { background: var(--bg); }
  .doc h1 { font-size: 24px; } .doc h2 { font-size: 19px; margin-top: 28px; }
  .doc a { color: var(--accent); }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Cheat sheet</h1></div>
  <nav><a href="index.html">← Back to the helper</a></nav>
</header>
<article id="doc" class="doc box">Loading…</article>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
  fetch('docs/cheatsheet.md')
    .then(r => r.text())
    .then(md => { document.getElementById('doc').innerHTML = marked.parse(md); })
    .catch(() => { document.getElementById('doc').textContent = 'Could not load docs/cheatsheet.md.'; });
</script>
</body>
</html>
